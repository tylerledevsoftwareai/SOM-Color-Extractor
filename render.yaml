services:
  - type: web
    name: som-palette-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_IPS
        value: ""  # Comma-separated allowed client IPs (e.g. "192.168.1.1,10.0.0.1"), or empty for open access
      - key: ALLOWED_ORIGINS
        value: ""  # Comma-separated allowed domain origins (e.g. "https://mywebsite.com"), or empty for open access
      - key: ALLOWED_API_KEYS
        value: ""  # Comma-separated valid API keys, or empty for open access
      - key: PYTHON_VERSION
        value: 3.11.0
